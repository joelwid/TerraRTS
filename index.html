<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraRTS</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main>
      <header>
        <div class="identity"><h1>TerraRTS</h1><span id="map-name"></span></div>
        <div class="clock">Simulation tick <span id="tick">0</span></div>
      </header>
      <section class="colony-hud" aria-label="Colony">
        <div class="economy-bar">
          <ul id="stock" aria-label="Inventory"></ul>
          <details class="production-panel">
            <summary>Production overview</summary>
            <div class="production-body">
              <table>
                <caption>Gross capacity per minute. Actual output, use and net over the last 60 simulation seconds.</caption>
                <thead><tr><th scope="col">Resource</th><th scope="col">Gross</th><th scope="col">Actual</th><th scope="col">Used</th><th scope="col">Net</th></tr></thead>
                <tbody id="production-rates"></tbody>
              </table>
            </div>
          </details>
        </div>
        <div id="build-options" role="group" aria-label="Build"></div>
        <output id="placement" aria-live="off"></output>
      </section>
      <div id="world"></div>
      <footer>
        <div class="selection-panel">
          <div class="selection-details">
            <output id="selection" aria-live="polite">No tile selected</output>
            <progress id="construction-progress" aria-label="Construction progress" hidden></progress>
            <button id="production-action" type="button" hidden></button>
            <button id="building-action" type="button" hidden></button>
          </div>
          <output id="feedback" aria-live="polite"></output>
        </div>
        <div class="controls">
          <span><kbd>WASD</kbd> / <kbd>↑←↓→</kbd> Pan</span>
          <span>Wheel to zoom</span>
          <span>Click to select</span>
          <span><kbd>Esc</kbd> Clear / exit build mode</span>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
